[package]
name = "leeway"
version = "0.1.6"
edition = "2024"
description = "A local-first terminal budgeting app focused on what's left."
repository = "https://github.com/nathanreyes/leeway"
readme = "README.md"
license = "MIT OR Apache-2.0"
homepage = "https://get-leeway.com"
# Keep the published crate to the buildable app. docs/help/*.md are embedded
# via include_str! and MUST stay; the marketing site, knowledge base, and
# design docs are not needed to build leeway.
exclude = ["site/", "knowledge/", "docs/plans/", "netlify.toml"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sys-locale = "0.3.2"
sha2 = "0.10.9"
hex = "0.4.3"
hostname = "0.4.2"
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
