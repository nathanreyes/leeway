# Publishes leeway to crates.io after a GitHub Release is published.
#
# The binary release pipeline (release.yml, generated by dist) creates the
# GitHub Release on a version tag; this workflow runs once that Release is
# published and pushes the same version to crates.io so `cargo install leeway`
# works.
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN
# (crates.io -> Account Settings -> API Tokens -> New Token, scoped to publish).
name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
