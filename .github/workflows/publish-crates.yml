# Publishes leeway to crates.io on a version tag, so `cargo install leeway`
# works alongside the binary release built by release.yml (generated by dist).
#
# Triggered by the version tag directly rather than the GitHub Release: a
# release created by the workflow's built-in GITHUB_TOKEN does not trigger
# other workflows, so a `release: published` trigger would never fire. The tag
# push (done by a human) does. This runs in parallel with the binary build;
# the two pipelines are independent.
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN
# (crates.io -> Account Settings -> API Tokens -> New Token, scoped to publish).
name: Publish to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
